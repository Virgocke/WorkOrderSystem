server:
  port: 63010

spring:
  application:
    name: gateway
  jackson:
    time-zone: GMT+8

  cloud:
    gateway:
      routes:
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
