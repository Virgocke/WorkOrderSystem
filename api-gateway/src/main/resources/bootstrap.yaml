server:
  port: 63010

spring:
  application:
    name: gateway
  jackson:
    time-zone: GMT+8

  cloud:
    gateway:
      routes:
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/auth/**
          filters: 
            - StripPrefix=1

        - id: userAndHandler-service
          uri: lb://userAndHandler-service
          predicates: 
            - Path=/api/users/**,/api/handlers/**,/api/handler-skills/**,/api/departments/**,/api/skills/**
          filters: 
            - StripPrefix=1

        - id: oauth-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/oauth/**
          filters:
            - StripPrefix=1

        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/tickets/**,/api/ticket-categories/**
          filters:
            - StripPrefix=1

        - id: handler-service
          uri: lb://handler-service
          predicates:
            - Path=/api/handlers/**
          filters:
            - StripPrefix=1

        - id: Assign-Engine
          uri: lb://Assign-Engine
          predicates:
            - Path=/api/assign-engine/**,/api/configurations/**,/api/assignment-records/**
          filters:
            - StripPrefix=1

        - id: Notification
          uri: lb://Notification
          predicates:
            - Path=/api/notifications/**,/api/alerts/**
          filters:
            - StripPrefix=1

        - id: Sla-Monitor
          uri: lb://Sla-Monitor
          predicates:
            - Path=/api/sla/**
          filters:
            - StripPrefix=1

        - id: Search
          uri: lb://Search
          predicates:
            - Path=/api/dashboard/**,/api/handler/**,/api/reports/**,/api/ratings/**
          filters:
            - StripPrefix=1
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
security:
  oauth2:
    jwt:
      # 本地联调默认值；生产必须通过环境变量设置高强度密钥，且不得提交真实密钥。
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}
