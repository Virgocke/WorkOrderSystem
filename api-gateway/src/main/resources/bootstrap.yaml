server:
  port: 63010

spring:
  application:
    name: gateway
  jackson:
    time-zone: GMT+8

  cloud:
    gateway:
      routes:
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/auth/**
          filters: 
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates: 
            - Path=/api/users/**
          filters: 
            - StripPrefix=1

        - id: oauth-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/oauth/**
          filters:
            - StripPrefix=1

        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/tickets/**,/api/ticket-categories/**
          filters:
            - StripPrefix=1

        - id: handler-service
          uri: lb://handler-service
          predicates:
            - Path=/api/handlers/**
          filters:
            - StripPrefix=1
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
security:
  oauth2:
    jwt:
      # 本地联调默认值；生产必须通过环境变量设置高强度密钥，且不得提交真实密钥。
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}