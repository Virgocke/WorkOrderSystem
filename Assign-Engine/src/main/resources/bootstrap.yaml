server:
  port: 65020

spring:
  application:
    name: Assign-Engine
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
  jackson:
    time-zone: GMT+8
    deserialization:
      use-big-decimal-for-floats: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/WorkOrderSystem?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Virgo0916

mybatis-plus:
  mapper-locations: classpath*:*Mapper.xml

security:
  oauth2:
    jwt:
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}

assignment:
  weights:
    skill: 40
    load: 25
    sla: 20
    rating: 15

work-order:
  messaging:
    enabled: ${WORK_ORDER_MESSAGING_ENABLED:false}
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    producer-group: ${ROCKETMQ_ASSIGN_PRODUCER_GROUP:assign-engine-producer}
    ticket-topic: ${WORK_ORDER_TICKET_EVENT_TOPIC:wo-ticket-event}
    outbox:
      enabled: ${WORK_ORDER_OUTBOX_ENABLED:true}
      source-service: assign-engine
    ticket-created:
      consumer-group: ${ROCKETMQ_ASSIGN_CREATED_CONSUMER_GROUP:assign-ticket-created-v1}
