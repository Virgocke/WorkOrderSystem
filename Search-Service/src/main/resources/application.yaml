spring:
  autoconfigure:
    # 由下面的自定义配置类统一创建客户端。
    # 避免关闭功能后，Boot 又自动创建默认客户端。
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

work-order:
  messaging:
    enabled: ${WORK_ORDER_MESSAGING_ENABLED:true}
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    ticket-search-topic: ${WORK_ORDER_TICKET_SEARCH_EVENT_TOPIC:wo-ticket-search-event}
    # Search-Service 只消费搜索事件，不运行发送端 Relay。
    outbox:
      enabled: false
  elasticsearch:
    enabled: ${WORK_ORDER_ES_ENABLED:true}

    # 支持配置多个节点，使用逗号分隔。
    uris: ${WORK_ORDER_ES_URIS:http://localhost:9200}

    username: ${WORK_ORDER_ES_USERNAME:}
    password: ${WORK_ORDER_ES_PASSWORD:}

    connect-timeout-ms: 3000
    socket-timeout-ms: 10000
    connection-request-timeout-ms: 1000

    max-connections: 50
    max-connections-per-route: 25

    # V2 标题和描述使用 IK：建索引 ik_max_word，查询 ik_smart。
    # 查询和写入使用别名；旧 standard 索引需重建，初始化不会自动切换别名。
    ticket-index-alias: ${WORK_ORDER_ES_TICKET_INDEX_ALIAS:wo-ticket}
    ticket-index-name: ${WORK_ORDER_ES_TICKET_INDEX_NAME:wo-ticket-v2}

    # 用户/处理人共用目录快照；仅内容变化时重建，完整写入后原子切换别名。
    directory-index-alias: ${WORK_ORDER_ES_DIRECTORY_INDEX_ALIAS:wo-directory}
    directory-index-prefix: ${WORK_ORDER_ES_DIRECTORY_INDEX_PREFIX:wo-directory-v1}
    directory-sync-delay-ms: ${WORK_ORDER_ES_DIRECTORY_SYNC_DELAY_MS:30000}

    # 仅首次部署或本地调试开启；不会导入任何工单数据。
    initialize-on-startup: ${WORK_ORDER_ES_INITIALIZE_ON_STARTUP:false}
    number-of-shards: 1
    number-of-replicas: 0
    max-bulk-size: 1000

    # 显式开启后由管理员创建导入任务，验证并独立发布前关键词请求仍为 503。
    ticket-sync:
      enabled: ${WORK_ORDER_TICKET_SEARCH_SYNC_ENABLED:true}
      consumer-group: ${WORK_ORDER_TICKET_SEARCH_CONSUMER_GROUP:search-ticket-projection-v1}
      source-zone-id: ${WORK_ORDER_TICKET_SEARCH_SOURCE_ZONE_ID:Asia/Shanghai}
      batch-size: 500
      batches-per-run: 10
      import-delay-ms: 1000
      reconcile-delay-ms: 30000
      import-lease-seconds: 120

    # 审计索引与工单索引独立；启用 ES 后自动初始化、分批回填并周期对账。
    # 首轮回填完成前关键词请求明确失败，无关键词查询仍使用 MySQL。
    audit:
      index-alias: ${WORK_ORDER_ES_AUDIT_INDEX_ALIAS:wo-audit}
      index-name: ${WORK_ORDER_ES_AUDIT_INDEX_NAME:wo-audit-v1}
      batch-size: 500
      batches-per-run: 10
      # 每轮扫到末尾会重新从头扫描，补齐较小 ID 的迟提交日志。
      sync-delay-ms: ${WORK_ORDER_ES_AUDIT_SYNC_DELAY_MS:30000}
