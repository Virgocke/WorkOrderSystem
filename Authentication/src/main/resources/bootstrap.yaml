server:
  port: 63071

spring:
  application:
    name: authentication-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/WorkOrderSystem?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Virgo0916

  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        # 必须要在同一个group的服务，才可以互相调用
        # group的名字随便取，但是必须都叫同一个名，不然调用不了
        group: WorkOrder-project
  redis:
    host: localhost
    port: 6379
    database: 0 # 默认数据库
    lettuce:
      pool:
        max-active: 20 # 最大活跃数
        max-idle: 10 # 最大空闲数
        min-idle: 0 # 最小空闲数
    timeout: 10000 # 连接超时时间


security:
  oauth2:
    jwt:
      # 本地联调默认值；生产必须通过环境变量设置高强度密钥，且不得提交真实密钥。
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}
    client:
      id: WorkOrderSystem
      secret: WorkOrderSystemSecret
