spring:
  application:
    name: ticket-service
  jackson:
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/WorkOrderSystem?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Virgo0916
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
