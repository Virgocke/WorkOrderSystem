  endpoint: http://localhost:9000
  access-key: minio
  secret-key: minio123
  bucket-name: workorder



security:
  oauth2:
    jwt:
      # 本地联调必须与认证服务保持一致；生产环境请使用环境变量注入公钥或验签密钥。
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}

mybatis-plus:
  mapper-locations: classpath*:*Mapper.xml