server:
  port: 63030

spring:
  application:
    name: Notification
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
  jackson:
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/WorkOrderSystem?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Virgo0916

mybatis-plus:
  mapper-locations: classpath*:*Mapper.xml

security:
  oauth2:
    jwt:
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}

work-order:
  messaging:
    enabled: ${WORK_ORDER_MESSAGING_ENABLED:true}
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    ticket-topic: ${WORK_ORDER_TICKET_EVENT_TOPIC:wo-ticket-event}
    ticket-assigned:
      consumer-group: ${ROCKETMQ_TICKET_ASSIGNED_CONSUMER_GROUP:notification-ticket-event-v1}
      selector-expression: ASSIGNED
    consumer:
      max-reconsume-times: 16
