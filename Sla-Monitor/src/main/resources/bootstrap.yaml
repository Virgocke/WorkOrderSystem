server:
  port: 63050

spring:
  application:
    name: Sla-Monitor
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: dev
        group: WorkOrder-project
  jackson:
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/WorkOrderSystem?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: Virgo0916

security:
  oauth2:
    jwt:
      signing-key: ${OAUTH_JWT_SIGNING_KEY:local-development-signing-key-change-before-production}

work-order:
  messaging:
    enabled: ${WORK_ORDER_MESSAGING_ENABLED:false}
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    ticket-topic: ${WORK_ORDER_TICKET_EVENT_TOPIC:wo-ticket-event}
    producer-group: ${ROCKETMQ_SLA_PRODUCER_GROUP:sla-monitor-producer}
    outbox:
      enabled: true
      source-service: sla-monitor
    sla-ticket-events:
      consumer-group: ${ROCKETMQ_SLA_TICKET_EVENT_CONSUMER_GROUP:sla-ticket-event-v1}
    consumer:
      max-reconsume-times: 16
